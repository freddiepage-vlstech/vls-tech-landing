name: Preview pull request
on: pull_request
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/23682612565/locations/global/workloadIdentityPools/github/providers/vls-tech-landing
          service_account: github-action-1354847428@vls-tech-landing.iam.gserviceaccount.com
      - run: npx firebase-tools@latest hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project vls-tech-landing --non-interactive --debug
